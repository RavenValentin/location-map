<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта міста</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { margin: 0; background: #0d0d1a; }
    #pw-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(10,10,20,0.97);
      display: flex; align-items: center; justify-content: center;
    }
    /* sidebar and mobile-nav hidden via inline style until auth */
  </style>
</head>
<body>

<div id="map"></div>

<!-- Password gate -->
<div id="pw-overlay">
  <div class="pw-box glass" id="pw-form">
    <div class="pw-icon">🗺</div>
    <h3>Карта міста</h3>
    <p>Введіть пароль для доступу</p>
    <input id="pw-input" type="password" placeholder="Пароль" autocomplete="current-password">
    <div id="pw-error" class="pw-error"></div>
    <button id="pw-submit" class="btn btn-primary">Увійти →</button>
  </div>
</div>

<div id="sidebar" style="display:none">
  <!-- Mobile drag handle -->
  <div id="sidebar-handle" aria-label="Відкрити/закрити список">
    <div class="handle-bar"></div>
  </div>

  <!-- Header -->
  <div class="sidebar-header">
    <div class="sidebar-title">
      <span>📍</span> Карта міста
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <!-- Location list -->
  <div class="location-list" id="location-list">
    <div class="no-locations">Завантаження...</div>
  </div>

  <!-- Admin link -->
  <a href="admin.html" class="admin-btn">⚙️ Адмін-панель</a>
</div>

<!-- Mobile floating nav (shown after auth, mobile only) -->
<div id="mobile-nav" style="display:none">
  <button id="mobile-menu-btn" aria-label="Меню">
    <span class="mob-icon">☰</span>
    <span class="mob-label">Меню</span>
  </button>
  <a href="admin.html" id="mobile-admin-btn" aria-label="Адмін">
    <span class="mob-icon">⚙️</span>
    <span class="mob-label">Адмін</span>
  </a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/auth.js"></script>
<script src="js/map.js"></script>
</body>
</html>
